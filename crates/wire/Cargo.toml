[package]
name = "infy-wire"
version = "0.1.0"
edition = "2021"
description = "The OpenAI-compatible HTTP protocol infy speaks, in both directions. kernel + serde."
publish = false

[dependencies]
infy-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
