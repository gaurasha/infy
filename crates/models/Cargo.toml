[package]
name = "infy-models"
version = "0.1.0"
edition = "2021"
description = "Model architectures on Rust tensor primitives: GGUF → Llama family, growable KV cache."
publish = false

[dependencies]
infy-kernel = { path = "../kernel" }
candle-core = "0.11"
candle-nn = "0.11"

[dev-dependencies]
tempfile = "3"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
