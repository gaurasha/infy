[package]
name = "infy-server"
version = "0.1.0"
edition = "2021"
description = "The OpenAI-compatible HTTP API over any backend."
publish = false

[dependencies]
infy-kernel = { path = "../kernel" }
infy-wire = { path = "../wire" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
