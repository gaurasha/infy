[package]
name = "infy-runtime"
version = "0.1.0"
edition = "2021"
description = "External engines as data: ollama, llama.cpp, LM Studio. Detect, start, stop, install, list, chat."
publish = false

[dependencies]
infy-kernel = { path = "../kernel" }
infy-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"], optional = true }

[features]
default = ["system"]
system = ["dep:ureq"]
