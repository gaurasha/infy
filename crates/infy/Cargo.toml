[package]
name = "infy"
version = "0.1.0"
edition = "2021"
description = "A local inference engine. The composition root and CLI: the only crate that depends on everything."
publish = false

[[bin]]
name = "infy"
path = "src/main.rs"

[dependencies]
infy-engine = { path = "../engine" }
infy-hub = { path = "../hub" }
infy-kernel = { path = "../kernel" }
infy-models = { path = "../models" }
infy-runtime = { path = "../runtime" }
infy-server = { path = "../server" }
infy-wire = { path = "../wire" }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
dirs = "6"
rustyline = { version = "17", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
cuda = ["infy-models/cuda"]
metal = ["infy-models/metal"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
